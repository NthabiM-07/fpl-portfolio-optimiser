[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fplopt"
version = "1.1.0"
description = "FPL team selection as constrained portfolio optimisation: two-stage ML forecasts, calibrated intervals and exact MILP selection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nthabiseng Maoka" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "streamlit>=1.50",
    "plotly>=5.18",
    "requests>=2.31",
    "mcp>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.100", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
